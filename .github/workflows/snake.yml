
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Aiza-C
          outputs: |
            dist/github-snake.svg?color_snake=%23588157&color_dots=%23ebf2e3,%23c7d9b3,%23a3b18a,%23588157,%23344e41
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a3b18a

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
